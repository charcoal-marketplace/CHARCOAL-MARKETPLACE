<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Login</title>

<link
  rel="stylesheet"
  href="admin-login.css"
>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<body>

  </button>

  <p id="msg"></p>

</div>

<!-- Admin Login JavaScript -->
<script src="admin-login.js"></script>

</body>
</html>
